[workspace]
resolver = "3"
members = ["crates/bourbon-core", "crates/bourbon-app", "crates/bourbon-cli", "crates/bourbon-markdown"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-only"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev.package."*"]
debug = false

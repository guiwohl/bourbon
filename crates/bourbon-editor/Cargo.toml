[package]
name = "bourbon-editor"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bourbon-markdown = { path = "../bourbon-markdown" }
bourbon-text = { path = "../bourbon-text" }
bourbon-ui = { path = "../bourbon-ui" }
gpui = { package = "gpui-pre", version = "0.3.11" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.11", features = ["test-support"] }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
proptest = "1"

[lints]
workspace = true

[package]
name = "bourbon-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
dev = []

[dependencies]
bourbon-core = { path = "../bourbon-core" }
gpui-kit = { version = "0.9.0", features = ["tree-sitter-markdown"] }
jiff = "0.2.38"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
gpui-kit = { version = "0.9.0", features = ["tree-sitter-markdown", "test-support"] }

[lints]
workspace = true

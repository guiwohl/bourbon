[package]
name = "bourbon-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
dev = []

[dependencies]
bourbon-core = { path = "../bourbon-core" }
bourbon-editor = { path = "../bourbon-editor" }
bourbon-ui = { path = "../bourbon-ui" }
gpui = { package = "gpui-pre", version = "0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.11", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-kit = { version = "0.9.0", features = ["tree-sitter-markdown"] }
jiff = "0.2.38"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.11", features = ["test-support"] }
tempfile = "3"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
gpui-kit = { version = "0.9.0", features = ["tree-sitter-markdown", "test-support"] }

[lints]
workspace = true

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep build-essential clang cmake libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: just check

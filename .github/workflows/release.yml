name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag matches the workspace version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang cmake libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: cargo build --release --locked --workspace
      - name: Package
        run: |
          name="bourbon-$VERSION-x86_64-linux"
          mkdir -p "$name"
          cp target/release/bourbon-app target/release/bourbon "$name/"
          cp packaging/bourbon.desktop LICENSE README.md "$name/"
          cp -r assets/icons/hicolor "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "bourbon-$VERSION-x86_64-linux.tar.gz" --draft --title "Bourbon $VERSION" --generate-notes
